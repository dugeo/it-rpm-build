name: RPM manifest build and publish

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'templates/**'
      - 'scripts/**'
      - 'Containerfile'
      - '.github/workflows/rpm-build.yml'
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest path under packages/
        required: true
        default: packages/lustre-2.16.1.yaml
        type: string
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'templates/**'
      - 'scripts/**'
      - 'Containerfile'
      - '.github/workflows/rpm-build.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: rpm-build-runners
    # containerMode: kubernetes requires every job on this runner to
    # declare a job container -- jobs without one are rejected outright.
    container:
      image: registry.kube.dug.com/rpm-build:0.1.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests
        run: |
          for manifest in packages/*.yaml; do
            python3 scripts/read-manifest.py "$manifest" >/dev/null
          done

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: rpm-build-runners
    timeout-minutes: 120
    # containerMode: kubernetes places this container as a real sibling
    # container in the runner pod, sharing GITHUB_WORKSPACE through the
    # scale set's kubernetesModeWorkVolumeClaim -- no docker-in-docker,
    # no bind-mount translation. `mock` needs chroot/mount privileges,
    # granted through `options`.
    container:
      image: registry.kube.dug.com/rpm-build:0.1.1
      options: --privileged
    env:
      MANIFEST: ${{ inputs.manifest || 'packages/lustre-2.16.1.yaml' }}
      CGIT_REMOTE_BASE: "git@cgit.devops.svc.cluster.local:"
      NEXUS_BASE_URL: https://nexus.kube.dug.com/repository
      LEGACY_NEXUS_USERNAME: ${{ secrets.LEGACY_NEXUS_USERNAME }}
      LEGACY_NEXUS_PASSWORD: ${{ secrets.LEGACY_NEXUS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest
        id: manifest
        run: |
          python3 scripts/read-manifest.py "$MANIFEST" > "$RUNNER_TEMP/manifest.env"
          cat "$RUNNER_TEMP/manifest.env" >> "$GITHUB_ENV"

      - name: Import, build, verify, and publish
        env:
          CGIT_SSH_PRIVATE_KEY: ${{ secrets.CGIT_SSH_PRIVATE_KEY }}
          CGIT_REPO_ADMIN_PRIVATE_KEY: ${{ secrets.CGIT_REPO_ADMIN_PRIVATE_KEY }}
          CGIT_KNOWN_HOSTS: ${{ secrets.CGIT_KNOWN_HOSTS }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          LEGACY_NEXUS_USERNAME: ${{ secrets.LEGACY_NEXUS_USERNAME }}
          LEGACY_NEXUS_PASSWORD: ${{ secrets.LEGACY_NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CGIT_SSH_PRIVATE_KEY"
          test -n "$CGIT_REPO_ADMIN_PRIVATE_KEY"
          test -n "$CGIT_KNOWN_HOSTS"
          test -n "$NEXUS_USERNAME"
          test -n "$NEXUS_PASSWORD"
          install -d -m 0700 /root/.ssh
          printf '%s\n' "$CGIT_SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
          printf '%s\n' "$CGIT_REPO_ADMIN_PRIVATE_KEY" > /root/.ssh/repo-admin
          chmod 0600 /root/.ssh/id_ed25519 /root/.ssh/repo-admin

          internal_key=$(ssh-keyscan -T 5 -t ed25519 cgit.devops.svc.cluster.local 2>/tmp/cgit-keyscan.err | grep -v "^#" | head -n1)
          if test -z "$internal_key"; then
            echo "cgit host-key scan returned no key"
            cat /tmp/cgit-keyscan.err >&2 || true
            exit 1
          fi
          read -r _ key_type key_blob _ <<< "$internal_key"
          if test -z "$key_type" || test -z "$key_blob"; then
            echo "cgit host-key scan returned an unexpected format"
            exit 1
          fi
          printf "%s %s\n" "$key_type" "$key_blob" > /tmp/cgit-host-key
          fingerprint_line=$(ssh-keygen -lf /tmp/cgit-host-key -E sha256)
          actual_fingerprint=${fingerprint_line#* }
          actual_fingerprint=${actual_fingerprint%% *}
          echo "cgit scanned host-key fingerprint: $actual_fingerprint"
          if test "$actual_fingerprint" != "SHA256:z/nAPjFPgGvgSgJ9jLWLh/YfDTW6zdXwIJNO750f8Lc"; then
            echo "cgit host-key fingerprint mismatch"
            exit 1
          fi
          printf "%s\n" "$internal_key" >> /root/.ssh/known_hosts
          printf "%s\n" "Host cgit.devops.svc.cluster.local" "  User git" "  IdentityFile /root/.ssh/id_ed25519" "  IdentitiesOnly yes" "  StrictHostKeyChecking yes" > /root/.ssh/config
          chmod 0600 /root/.ssh/config

          install -d -m 0755 /etc/yum.repos.d
          printf "[legacy]\nname=legacy DUG EL\nbaseurl=%s\nenabled=1\ngpgcheck=0\nusername=%s\npassword=%s\n" "$RPM_REPOSITORY_URL" "$LEGACY_NEXUS_USERNAME" "$LEGACY_NEXUS_PASSWORD" > /etc/yum.repos.d/legacy.repo

          workdir=/workspace
          rm -rf "$workdir"
          install -d -m 0755 "$workdir/input" "$workdir/results"

          curl --fail --location --retry 5 --retry-all-errors --output "$workdir/input/source.src.rpm" "$SRPM_URL"
          printf "%s  %s\n" "$SRPM_SHA256" "$workdir/input/source.src.rpm" | sha256sum --check -

          if ! git ls-remote "$CGIT_REMOTE_BASE$REPOSITORY.git" HEAD >/dev/null 2>&1; then
            ssh -i /root/.ssh/repo-admin -o IdentitiesOnly=yes git@cgit.devops.svc.cluster.local "newrepo $REPOSITORY"
          fi
          git clone "$CGIT_REMOTE_BASE$REPOSITORY.git" "$workdir/package"
          cd "$workdir/package"
          rpkg import --do-not-check-specfile-name --offline "$workdir/input/source.src.rpm"
          mkdir -p SOURCES
          cp "$workdir/input/source.src.rpm" "SOURCES/$(basename "$workdir/input/source.src.rpm")"
          git config user.name "RPM CI Import"
          git config user.email "rpm-ci@kube.dug.com"
          git diff --check
          git add -A
          git commit -m "Import $(rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}" "$workdir/input/source.src.rpm")" || true
          git push origin HEAD

          # Build inputs belong to the package's dist-git repository. Copy
          # them only after import so a newly created repository receives
          # the verified SRPM even when its build contract is incomplete.
          cp -a "$GITHUB_WORKSPACE/templates/$BUILD_TEMPLATE/." "$workdir/package/"
          test -f "$workdir/package/$BUILD_SCRIPT"
          test -f "$workdir/package/$MOCK_CONFIG"
          chmod +x "$workdir/package/$BUILD_SCRIPT"
          cd "$workdir/package"
          mkdir -p "$workdir/results/srpm"
          rpkg --release rhel-9 srpm --builddir "$workdir/results/srpm"
          find "$workdir/package" -maxdepth 1 -type f -name '*.src.rpm' -exec mv -t "$workdir/results/srpm/" {} +
          ./"$BUILD_SCRIPT" --arch x86_64 ${KERNEL_VERSION:+--kernel="$KERNEL_VERSION"}
          find "$workdir/results/rpm" "$workdir/package" -type f -name "*.rpm" -print -exec rpm -K {} \; | tee "$workdir/results/rpm-verification.txt"

          # Nexus hosted repos reject re-uploads of an existing path (HTTP 400,
          # no-redeploy policy), so re-running the pipeline against an
          # unchanged SRPM/RPM set must not fail here. Skip any artifact
          # that's already present at the destination path instead of
          # unconditionally PUTting it.
          upload_if_absent() {
            local file="$1" url="$2"
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" "$url")"
            if [ "$code" = "200" ]; then
              echo "skip (already published): $url"
              return 0
            fi
            curl --fail --upload-file "$file" --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" "$url"
          }

          find "$workdir/results/srpm" "$workdir/package" -type f -name "*.src.rpm" -print0 | while IFS= read -r -d "" srpm_file; do
            upload_if_absent "$srpm_file" "$NEXUS_BASE_URL/$NEXUS_REPOSITORY/$(basename "$srpm_file")"
          done
          find "$workdir/results/rpm" "$workdir/package" -type f -name "*.rpm" -not -name "*.src.rpm" -print0 | while IFS= read -r -d "" rpm_file; do
            upload_if_absent "$rpm_file" "$NEXUS_BASE_URL/$NEXUS_REPOSITORY/$(basename "$rpm_file")"
          done
