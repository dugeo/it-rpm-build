"""el9 mock build-root template.

Selected by packages whose manifest sets `build.template: el9`. This file is
committed to git, so it MUST NOT contain credentials. build.sh appends the
legacy DUG repository (with credentials taken from the environment at build
time) and any exact kernel-devel package pin before invoking mock with this
config as a base.
"""

config_opts['root'] = 'rpm-build-el9'
config_opts['target_arch'] = 'x86_64'
config_opts['legal_host_arches'] = ('x86_64',)
config_opts['dist'] = 'el9'
config_opts['releasever'] = '9'
config_opts['package_manager'] = 'dnf'
config_opts['use_bootstrap'] = True
config_opts['use_bootstrap_image'] = True
config_opts['bootstrap_image'] = 'quay.io/centos/centos:stream9'
config_opts['isolation'] = 'simple'
config_opts['chroot_setup_cmd'] = (
    'install bash coreutils cpio diffutils findutils gawk grep gzip info '
    'patch rpm-build sed shadow-utils tar unzip util-linux which xz gcc '
    'make kernel-rpm-macros elfutils-libelf-devel python3 python3-devel'
)

config_opts['dnf.conf'] = """
[main]
keepcache=1
debuglevel=2
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=mock
syslog_device=
metadata_expire=0
mdpolicy=group:primary
best=1
install_weak_deps=0
protected_packages=
user_agent={{ user_agent }}
module_platform_id=platform:el9

[centos-baseos]
name=CentOS Stream 9 BaseOS
baseurl=https://mirror.stream.centos.org/9-stream/BaseOS/$basearch/os/
enabled=1
gpgcheck=0

[centos-appstream]
name=CentOS Stream 9 AppStream
baseurl=https://mirror.stream.centos.org/9-stream/AppStream/$basearch/os/
enabled=1
gpgcheck=0

[centos-crb]
name=CentOS Stream 9 CRB
baseurl=https://mirror.stream.centos.org/9-stream/CRB/$basearch/os/
enabled=1
gpgcheck=0

[epel]
name=EPEL 9
mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=epel-9&arch=$basearch
enabled=1
gpgcheck=0
skip_if_unavailable=1
"""
